<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Lilita; src: url("file:///C:/Users/romel/Documents/orbitdepot/unity/Assets/Resources/Fonts/LilitaOne.ttf"); }
html, body { margin: 0; background: transparent; }
canvas { display: block; }
</style></head>
<body>
<canvas id="c"></canvas>
<script>
// ?mode=icon&size=512  or  ?mode=og (1200x630, background = bg.png next to this file)
const q = new URLSearchParams(location.search);
const mode = q.get("mode") || "icon";
const c = document.getElementById("c"), g = c.getContext("2d");

function box(x, y, s) {
  // an isometric cardboard carton with tape
  const h = s * 0.62;
  g.lineJoin = "round";
  // top
  g.fillStyle = "#e7b77a";
  g.beginPath(); g.moveTo(x, y - h); g.lineTo(x + s, y - h - s * 0.5); g.lineTo(x, y - h - s); g.lineTo(x - s, y - h - s * 0.5); g.closePath(); g.fill();
  // left
  g.fillStyle = "#c98f4f";
  g.beginPath(); g.moveTo(x - s, y - h - s * 0.5); g.lineTo(x, y - h); g.lineTo(x, y); g.lineTo(x - s, y - s * 0.5); g.closePath(); g.fill();
  // right
  g.fillStyle = "#a9733c";
  g.beginPath(); g.moveTo(x + s, y - h - s * 0.5); g.lineTo(x, y - h); g.lineTo(x, y); g.lineTo(x + s, y - s * 0.5); g.closePath(); g.fill();
  // tape across the top
  g.fillStyle = "rgba(255,240,210,.85)";
  g.beginPath(); g.moveTo(x - s * 0.5 - s * 0.09, y - h - s * 0.75 + s * 0.045); g.lineTo(x + s * 0.5 - s * 0.09, y - h - s * 0.25 + s * 0.045);
  g.lineTo(x + s * 0.5 + s * 0.09, y - h - s * 0.25 - s * 0.045); g.lineTo(x - s * 0.5 + s * 0.09, y - h - s * 0.75 - s * 0.045); g.closePath(); g.fill();
  // label
  g.fillStyle = "#ffffff";
  g.beginPath(); g.moveTo(x + s * 0.25, y - h * 0.62 - s * 0.12); g.lineTo(x + s * 0.68, y - h * 0.62 - s * 0.34); g.lineTo(x + s * 0.68, y - h * 0.3 - s * 0.34); g.lineTo(x + s * 0.25, y - h * 0.3 - s * 0.12); g.closePath(); g.fill();
}

function icon(S) {
  c.width = c.height = S;
  const r = S * 0.22;
  g.fillStyle = "#0b1426";
  g.beginPath(); g.roundRect(0, 0, S, S, r); g.fill();
  const grd = g.createRadialGradient(S * 0.5, S * 0.42, S * 0.05, S * 0.5, S * 0.5, S * 0.7);
  grd.addColorStop(0, "rgba(70,110,200,.55)"); grd.addColorStop(1, "rgba(11,20,38,0)");
  g.fillStyle = grd; g.beginPath(); g.roundRect(0, 0, S, S, r); g.fill();
  // stars
  const rnd = (n) => (Math.sin(n * 91.7) * 43758.5453) % 1;
  for (let i = 0; i < 26; i++) { g.fillStyle = "rgba(255,255,255," + (0.35 + Math.abs(rnd(i + 3)) * 0.6) + ")"; g.beginPath(); g.arc(Math.abs(rnd(i)) * S, Math.abs(rnd(i + 40)) * S * 0.55, S * 0.006 + Math.abs(rnd(i + 9)) * S * 0.006, 0, 7); g.fill(); }
  // orbit ring behind the box
  g.save(); g.translate(S * 0.5, S * 0.56); g.rotate(-0.32);
  g.strokeStyle = "#ffc93c"; g.lineWidth = S * 0.04; g.beginPath(); g.ellipse(0, 0, S * 0.42, S * 0.14, 0, Math.PI, Math.PI * 2); g.stroke();
  g.restore();
  box(S * 0.5, S * 0.8, S * 0.27);
  // front half of the ring
  g.save(); g.translate(S * 0.5, S * 0.56); g.rotate(-0.32);
  g.strokeStyle = "#ffc93c"; g.lineWidth = S * 0.04; g.beginPath(); g.ellipse(0, 0, S * 0.42, S * 0.14, 0, 0, Math.PI); g.stroke();
  g.fillStyle = "#3cc7ff"; g.beginPath(); g.arc(S * 0.42, 0, S * 0.045, 0, 7); g.fill();
  g.restore();
}

async function og() {
  c.width = 1200; c.height = 630;
  const img = new Image(); img.src = "bg.png"; await img.decode();
  const s = Math.max(1200 / img.width, 630 / img.height);
  g.drawImage(img, (1200 - img.width * s) / 2 + 130, (630 - img.height * s) / 2, img.width * s, img.height * s);
  const fade = g.createLinearGradient(0, 0, 760, 0);
  fade.addColorStop(0, "rgba(7,11,24,.96)"); fade.addColorStop(0.55, "rgba(7,11,24,.82)"); fade.addColorStop(1, "rgba(7,11,24,0)");
  g.fillStyle = fade; g.fillRect(0, 0, 1200, 630);
  await document.fonts.load("120px Lilita");
  g.textBaseline = "alphabetic";
  g.font = "122px Lilita"; g.fillStyle = "#ffb000"; g.fillText("ORBIT", 62, 262);
  g.fillStyle = "#ffffff"; g.fillText("ORBIT", 56, 254);
  g.fillStyle = "#1a6fb0"; g.fillText("DEPOT", 62, 380);
  g.fillStyle = "#3cc7ff"; g.fillText("DEPOT", 56, 372);
  g.font = "34px Lilita"; g.fillStyle = "rgba(255,255,255,.85)"; g.fillText("RECEIVE · PICK · PACK · SHIP", 60, 440);
  g.font = "26px Lilita"; g.fillStyle = "#ffc93c"; g.fillText("RUN A FULFILLMENT FLOOR IN SPACE", 60, 486);
  // a small carton badge
  box(560, 560, 46);
}

(async () => { if (mode === "og") await og(); else icon(+(q.get("size") || 512)); document.title = "ready"; })();
</script>
</body></html>
