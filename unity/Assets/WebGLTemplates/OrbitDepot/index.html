<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ORBIT DEPOT — run a fulfillment floor in space</title>
  <meta name="description" content="Run a warehouse on a space station: receive cargo, rack it, pick orders, pack, sort and ship across the galaxy. Hire a crew and grow your depot. Free in your browser.">
  <meta name="theme-color" content="#10163a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="ORBIT DEPOT — run a fulfillment floor in space">
  <meta property="og:description" content="Receive. Pick. Pack. Ship. Build the slickest warehouse in orbit. Free, no download.">
  <meta property="og:image" content="__SITE_URL__/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="__SITE_URL__/og.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #070b18; touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #070b18; outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5;
      background: radial-gradient(circle at 50% 40%, #1d2a4f 0%, #070b18 65%); transition: opacity .5s; }
    #loader.done { opacity: 0; pointer-events: none; }
    .moon { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e8ebf2, #9aa0b0 70%);
      box-shadow: 0 0 60px rgba(180,190,255,.35); position: relative; animation: bob 2s ease-in-out infinite; }
    .moon::before, .moon::after { content: ""; position: absolute; border-radius: 50%; background: rgba(120,126,145,.55); }
    .moon::before { width: 26px; height: 26px; left: 26px; top: 58px; } .moon::after { width: 16px; height: 16px; left: 70px; top: 30px; }
    .burger { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); font-size: 44px; animation: spin 3s linear infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    @keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }
    h1 { margin: 34px 0 4px; font-size: 44px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 4px 0 #ffb000; }
    .tag { opacity: .7; font-weight: 700; letter-spacing: 2px; font-size: 13px; }
    .bar { width: 240px; height: 10px; border-radius: 10px; background: rgba(255,255,255,.14); margin-top: 28px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffc93c, #ff9a3c); transition: width .2s; border-radius: 10px; }
    #err { display: none; max-width: 320px; text-align: center; margin-top: 18px; font-size: 14px; opacity: .85; }
  </style>
</head>
<body>
  <script>
    // First-party analytics: anonymous daily event counts on the shared game server (no personal data).
    (function () {
      var G = "orbitdepot", API = new URLSearchParams(location.search).get("api") || "https://orbyt-api-production-29f6.up.railway.app";
      var q = [], uid;
      try { uid = localStorage.getItem("ev_uid"); if (!uid) { uid = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem("ev_uid", uid); } } catch (e) { uid = Math.random().toString(36).slice(2, 14); }
      function flush() {
        if (!q.length) return;
        var body = JSON.stringify({ g: G, s: uid, e: q.splice(0, 60) });
        try { if (navigator.sendBeacon && navigator.sendBeacon(API + "/api/ev", body)) return; } catch (e) {}
        try { fetch(API + "/api/ev", { method: "POST", body: body, keepalive: true }); } catch (e) {}
      }
      window.__ev = function (name, value) {
        q.push([String(name).toLowerCase().replace(/[^a-z0-9_]/g, "_").slice(0, 40), Math.round(Number(value) || 0)]);
        if (q.length >= 40) flush();
      };
      setInterval(flush, 15000);
      addEventListener("pagehide", flush);
      document.addEventListener("visibilitychange", function () { if (document.hidden) flush(); });
      window.__ev("page_view", 0);
      if (document.referrer) try { window.__ev("ref_" + new URL(document.referrer).hostname.replace(/^www\./, "").split(".")[0], 0); } catch (e) {}
    })();
  </script>

  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div class="moon"><div class="burger">📦</div></div>
    <h1>ORBIT DEPOT</h1>
    <div class="tag">RECEIVE · PICK · PACK · SHIP</div>
    <div class="bar"><i id="fill"></i></div>
    <div id="err"></div>
  </div>
  <script>
    // ---- Portal adapter: Poki / CrazyGames if present, otherwise a dev fallback that just grants rewards.
    (function () {
      var poki = function () { return window.PokiSDK; };
      var crazy = function () { return window.CrazyGames && window.CrazyGames.SDK; };
      window.SD = {
        adsAvailable: function () { return !!(poki() || crazy()); },   // rewarded ads only where a portal SDK exists
        rewarded: function () {
          if (poki()) return poki().rewardedBreak().then(function (ok) { return !!ok; });
          if (crazy()) return new Promise(function (res) {
            crazy().ad.requestAd("rewarded", { adFinished: function () { res(true); }, adError: function () { res(false); } });
          });
          return new Promise(function (res) { setTimeout(function () { res(true); }, 400); }); // dev: instant reward
        },
        gameplay: function (on) {
          try { if (poki()) on ? poki().gameplayStart() : poki().gameplayStop(); } catch (e) {}
          try { if (crazy()) on ? crazy().game.gameplayStart() : crazy().game.gameplayStop(); } catch (e) {}
        },
        ready: function () {
          try { if (poki()) poki().gameLoadingFinished(); } catch (e) {}
          try { if (crazy()) crazy().game.loadingStop(); } catch (e) {}
        },
        track: function (name, value) {
          try { window.__ev && window.__ev(name, value); } catch (e) {}
        }
      };
      ["gesturestart", "gesturechange", "contextmenu", "dblclick"].forEach(function (ev) {
        document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    })();

    (function () {
      var canvas = document.getElementById("unity-canvas"), loader = document.getElementById("loader");
      var fill = document.getElementById("fill"), err = document.getElementById("err");
      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        autoSyncPersistentDataPath: true,
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) { if (type === "error") { err.style.display = "block"; err.textContent = msg; } console.warn(msg); }
      };
      var s = document.createElement("script");
      s.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      s.onload = function () {
        try { window.CrazyGames && window.CrazyGames.SDK && window.CrazyGames.SDK.game.loadingStart(); } catch (e) {}
        createUnityInstance(canvas, config, function (p) { fill.style.width = Math.round(8 + p * 92) + "%"; })
          .then(function (inst) { window.unityInstance = inst;
            document.addEventListener("visibilitychange", function () { if (document.hidden) { try { inst.SendMessage("Game", "Persist"); } catch (e) {} } });
            window.addEventListener("pagehide", function () { try { inst.SendMessage("Game", "Persist"); } catch (e) {} }); fill.style.width = "100%"; setTimeout(function () { loader.classList.add("done"); canvas.focus(); }, 300); })
          .catch(function (m) { err.style.display = "block"; err.textContent = "Couldn't start: " + m; });
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
